<div class="text-end inner shadow-sm w-100 bg-white rounded">
  <p class="text-end text-muted opacity-50 mx-3"></p>
  <hr />
  <form [formGroup]="formInput">
    <div *ngIf="handle === 0">
      <label> شماره تماس</label>
      <input formControlName="tell" />
      <button
        *ngIf="chechtell() >= 5"
        (click)="handle = handle + 1"
        mat-raised-button
      >
        تایید
      </button>
    </div>

    <div *ngIf="handle === 1">
      <label> نوع پشتیبانی</label>
      <select (change)="handle = handle + 1" formControlName="typehc">
        <option value="خرابی">خرابی</option>
        <option value="دایری">دایری</option>
      </select>
    </div>
    <div class="m-3 pt-4">
      <div class="" w-100 *ngFor="let item of ques; let i = index">
        <ng-container *ngIf="handle > 1">
          <ng-container *ngIf="handle === i + 2">
            <ng-container
              *ngIf="item.type === 'all' || item.type === getType()"
            >
              <div class="w-100 m-2 p-1">
                <h5>
                  <span> {{ i + 1 }} - </span>
                  {{ item.title }}
                  <span class="text-muted">( {{ item.groups }} ) </span>
                </h5>
              </div>
              <select
                [id]="item.id"
                *ngIf="item.model === ''"
                (change)="changeResult($event, item)"
              >
                <option selected="selected">....</option>
                <option *ngFor="let i of answer" [value]="i.score">
                  {{ i.answer }}
                </option>
              </select>
              <div *ngIf="item.model === 'special'">
                <select
                  (change)="changeResult($event, item)"
                  formControlName="result"
                >
                  <option *ngFor="let j of scores" [value]="j">
                    {{ j }}
                  </option>
                </select>
              </div>

              <div *ngIf="item.model === 'text'">
                <input
                  formControlName="modelText"
                  (change)="changeResult($event, item)"
                  [id]="item.id"
                />
                <button mat-raised-button>تایید</button>
              </div>
            </ng-container>
          </ng-container>
        </ng-container>
      </div>
      <div class="">
        <button
          (click)="submit()"
          class="w-fit m-4"
          type="submit"
          *ngIf="handle === ques.length + 2"
          mat-raised-button
        >
          بروزرسانی
        </button>
      </div>
      <button
        *ngIf="handle > 0"
        class="m-2"
        (click)="handle = handle - 1"
        mat-raised-button
      >
        مرحله قبل
      </button>
    </div>
  </form>
</div>

<div class="headers">شماره های ثبت شده توسط من</div>
<div class="w-100 text-right p-2 m-1">
  <form [formGroup]="filterName">
    <div>
      <input
        class="input-style"
        placeholder="فیلتر شماره مشترک"
        formControlName="name"
      />
    </div>
  </form>
</div>

<pagination-controls
  [autoHide]="true"
  [directionLinks]="false"
  class="my-pagination especial"
  (pageChange)="events($event)"
></pagination-controls>
<table>
  <tr class="w-100 rows bg-darks text-light">
    <td>شماره مشترک</td>
    <td>تاریخ تماس</td>
    <td>حذف</td>
  </tr>
  <tr
    class="w-100 p-2 rows"
    *ngFor="
      let item of userFailure
        | paginate: { itemsPerPage: 20, currentPage: paginationPageNumber };
      let i = index
    "
  >
    <ng-container
      *ngIf="
        filterCheck(item?.tell, filteredName) ||
        filterCheck(item?.type, filteredName) ||
        filterCheck(item?.datetime, filteredName)
      "
    >
      <td>{{ item.tell }}</td>
      <td>{{ item.datetime }}</td>

      <td class="text-center" (click)="modalDelShow(item, true)">
        <i class="fa fa-trash"></i>
      </td>
    </ng-container>
  </tr>
</table>

<div class="modals text-center" *ngIf="modal">
  <div class="w-75 bg-light inline m-auto">
    <form [formGroup]="formEdit">
      <div>
        <label> شماره تماس</label>
        <input formControlName="tell" />
      </div>

      <div class="">
        <label> نوع پشتیبانی</label>
        <select formControlName="typehc">
          <option value="failure" [value]="editRow.tell">خرابی</option>
          <option value="ongoing">دایری</option>
        </select>
      </div>

      <div class="">
        <label> نتیجه تماس</label>
        <select (change)="changeResultEdit($event)" formControlName="result">
          <option value="satisfy" check>راضی</option>
          <option value="unsatisfy">ناراضی</option>
        </select>
      </div>

      <div class="w-100 p-3" *ngIf="unsatisfyingEdit">
        <label> علت نارضایتی</label>
        <div class="row w-100">
          <div class="col-md-4" *ngFor="let item of unsatisfyingTypes">
            <input
              type="checkbox"
              [id]="item"
              (change)="changeUnsatisfying($event, item)"
            />
            <label class="w-25"> {{ item }}</label>
          </div>
        </div>
      </div>

      <div class="">
        <button
          (click)="update()"
          class="w-fit m-4"
          type="submit"
          mat-raised-button
        >
          بروزرسانی
        </button>
        <button
          (click)="modal = false"
          class="w-fit m-4"
          type="submit"
          mat-raised-button
        >
          انصراف
        </button>
      </div>
    </form>
  </div>
</div>

<div class="modals text-center" *ngIf="modalDel">
  <div class="w-50 mt-4 bg-light inline">
    <div class="m-4 p-4">
      <h5>آیا از حذف مطمین هستید؟</h5>
    </div>
    <div class="mt-4 pt-4">
      <button
        (click)="delete()"
        *ngIf="!loadingProgress"
        class="w-fit m-4"
        type="submit"
        mat-raised-button
      >
        بله
      </button>
    </div>
    <div>
      <button
        (click)="modalDel = false"
        *ngIf="!loadingProgress"
        class="w-fit m-4"
        type="submit"
        mat-raised-button
      >
        انصراف
      </button>
    </div>
  </div>
</div>
