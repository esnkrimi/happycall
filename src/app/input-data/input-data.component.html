<div class="text-end inner shadow-sm w-100 bg-white rounded">
  <p class="text-end text-muted opacity-50 mx-3"></p>
  <hr />
  <form [formGroup]="formInput">
    <div>
      <label> شماره تماس</label>
      <input formControlName="tell" />
    </div>

    <div class="">
      <label> نوع پشتیبانی</label>
      <select formControlName="typehc">
        <option value="failure">خرابی</option>
        <option value="ongoing">دایری</option>
      </select>
    </div>

    <div class="">
      <label> نتیجه تماس</label>
      <select (change)="changeResult($event)" formControlName="result">
        <option value="satisfy">راضی</option>
        <option value="unsatisfy">ناراضی</option>
      </select>
    </div>

    <div class="w-100 p-3" *ngIf="unsatisfying">
      <label> علت نارضایتی</label>
      <div class="row w-100">
        <div class="col-md-4" *ngFor="let item of unsatisfyingTypes">
          <input
            type="checkbox"
            [id]="item"
            (change)="changeUnsatisfying($event, item)"
          />
          <label class="w-25"> {{ item }}</label>
        </div>
      </div>
    </div>

    <div class="">
      <button
        (click)="submit()"
        *ngIf="!loadingProgress"
        class="w-fit m-4"
        type="submit"
        [disabled]="formInput.invalid"
        mat-raised-button
      >
        بروزرسانی
      </button>
      <button
        [disabled]="formInput.invalid"
        *ngIf="loadingProgress"
        class="w-fit m-4"
        type="submit"
        mat-raised-button
      >
        <img src="../../assets/img/loading.gif" class="icon" />
      </button>
    </div>
  </form>
</div>

<div class="headers">شماره های ثبت شده توسط من</div>
<div class="w-100 text-right p-2 m-1">
  <form [formGroup]="filterName">
    <div>
      <input matInput formControlName="name" />
    </div>
  </form>
</div>

<pagination-controls
  [autoHide]="true"
  [directionLinks]="false"
  class="my-pagination especial"
  (pageChange)="events($event)"
></pagination-controls>
<table>
  <tr class="w-100 rows bg-dark text-light">
    <td>شماره مشترک</td>
    <td>تاریخ تماس</td>
    <td>نوع سرویس</td>
    <td>نتیجه</td>
    <td>ویرایش</td>
    <td>حذف</td>
  </tr>
  <tr
    class="w-100 p-2 rows"
    *ngFor="
      let item of userFailure
        | paginate: { itemsPerPage: 20, currentPage: paginationPageNumber };
      let i = index
    "
  >
    <ng-container
      *ngIf="
        filterCheck(item?.tell, filteredName) ||
        filterCheck(item?.typehc, filteredName) ||
        filterCheck(item?.result, filteredName) ||
        filterCheck(item?.datetime, filteredName)
      "
    >
      <td>{{ item.tell }}</td>
      <td>{{ item.datetime }}</td>
      <td>{{ item.typehc }}</td>
      <td>
        {{ item.result }}
        <ng-container *ngIf="item.result === 'شکایت'">
          <span
            class="border p-1 m-1 bg-dark text-light rounded"
            *ngFor="let i of item.resultunsatisfying"
          >
            {{ i }}
          </span>
        </ng-container>
      </td>
      <td class="text-center">
        <i (click)="modalShow(item?.id)" class="fa fa-edit"></i>
      </td>
      <td class="text-center">
        <i class="fa fa-trash"></i>
      </td>
    </ng-container>
  </tr>
</table>

<div class="modals text-center" *ngIf="modal">
  <div class="w-50 bg-light inline m-auto">
    <form [formGroup]="formEdit">
      <div>
        <label> شماره تماس</label>
        <input formControlName="tell" />
      </div>

      <div class="">
        <label> نوع پشتیبانی</label>
        <select formControlName="typehc">
          <option value="failure">خرابی</option>
          <option value="ongoing">دایری</option>
        </select>
      </div>

      <div class="">
        <label> نتیجه تماس</label>
        <select (change)="changeResult($event)" formControlName="result">
          <option value="satisfy">راضی</option>
          <option value="unsatisfy">ناراضی</option>
        </select>
      </div>

      <div class="w-100 p-3" *ngIf="unsatisfying">
        <label> علت نارضایتی</label>
        <div class="row w-100">
          <div class="col-md-4" *ngFor="let item of unsatisfyingTypes">
            <input
              type="checkbox"
              [id]="item"
              (change)="changeUnsatisfying($event, item)"
            />
            <label class="w-25"> {{ item }}</label>
          </div>
        </div>
      </div>

      <div class="">
        <button
          (click)="update()"
          *ngIf="!loadingProgress"
          class="w-fit m-4"
          type="submit"
          mat-raised-button
        >
          بروزرسانی
        </button>
        <button
          *ngIf="loadingProgress"
          class="w-fit m-4"
          type="submit"
          mat-raised-button
        >
          <img src="../../assets/img/loading.gif" class="icon" />
        </button>
      </div>
    </form>
  </div>
</div>
