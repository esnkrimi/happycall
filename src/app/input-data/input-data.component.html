<div class="text-end inner shadow-sm w-100 bg-white rounded">
  <p class="text-end text-muted opacity-50 mx-3"></p>
  <hr />
  <form [formGroup]="formInput">
    <div>
      <label> شماره تماس</label>
      <input formControlName="tell" />
    </div>

    <div class="">
      <label> نوع پشتیبانی</label>
      <select formControlName="typehc">
        <option value="failure">خرابی</option>
        <option value="ongoing">دایری</option>
      </select>
    </div>

    <div class="">
      <label> نتیجه تماس</label>
      <select (change)="changeResult($event)" formControlName="result">
        <option value="satisfy">راضی</option>
        <option value="unsatisfy">ناراضی</option>
      </select>
    </div>

    <div class="w-100 p-3" *ngIf="unsatisfying">
      <label> علت نارضایتی</label>
      <div class="row w-100">
        <div class="col-md-4" *ngFor="let item of unsatisfyingTypes">
          <input
            type="checkbox"
            [id]="item"
            (change)="changeUnsatisfying($event, item)"
          />
          <label class="w-25"> {{ item }}</label>
        </div>
      </div>
    </div>

    <div class="">
      <button
        (click)="submit()"
        *ngIf="!loadingProgress"
        class="w-fit m-4"
        type="submit"
        mat-raised-button
      >
        بروزرسانی
      </button>
      <button
        *ngIf="loadingProgress"
        class="w-fit m-4"
        type="submit"
        mat-raised-button
      >
        <img src="../../assets/img/loading.gif" class="icon" />
      </button>
    </div>
  </form>
</div>

<div class="headers">شماره های ثبت شده توسط من</div>
<table>
  <tr class="d-flex w-100 rows">
    <td>شماره مشترک</td>
    <td>تاریخ تماس</td>
    <td>نتیجه</td>
  </tr>

  <tr class="d-flex w-100 p-2 rows" *ngFor="let item of userFailure">
    <td>{{ item.tell }}</td>
    <td>{{ item.datetime }}</td>
    <td>{{ item.result }}</td>
    <td *ngIf="item.result === 'ناراضی'">
      <span
        class="border p-1 m-1 bg-dark text-light rounded"
        *ngFor="let i of item.resultunsatisfying"
      >
        {{ i }}
      </span>
    </td>
  </tr>
</table>
